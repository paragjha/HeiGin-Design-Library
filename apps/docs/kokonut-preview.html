<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- Isolated preview frame for the vendored Kokonut UI components. It mirrors the
         environment they are built for (Tailwind v4 defaults, Geist, a `dark` class)
         so the docs stylesheet cannot change how they look. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
    <title>Component preview</title>
    <script>
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/kokonut/preview-main.tsx"></script>
  </body>
</html>
