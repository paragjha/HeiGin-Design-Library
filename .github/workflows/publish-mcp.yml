name: Publish @heigin/mcp

# Publishes @heigin/mcp via npm trusted publishing (OIDC) when a tag like mcp-v0.1.0 is pushed.
# No npm token is stored in the repository. The npm package must already exist and have this
# workflow configured as its trusted publisher (npmjs.com > @heigin/mcp > Settings).
on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if [ "mcp-v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/mcp version $VERSION" && exit 1
          fi

      - name: Build
        run: npm run build:mcp

      - name: Smoke test
        run: |
          (
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 3
          ) | node packages/mcp/dist/index.js | grep -q '"list_components"'

      - name: Skip if this version is already published
        id: exists
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@heigin/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "@heigin/mcp@$VERSION is already published"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (public, with provenance)
        if: steps.exists.outputs.already == 'false'
        run: npm publish -w @heigin/mcp --access public --provenance
